name: CI Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # If you have a Maven wrapper, use ./mvnw ... instead of mvn ...
      - name: Build (skip tests)
        run: mvn -B -q clean install -DskipTests

      - name: Run tests normally (must pass)
        run: mvn -B -q test

      - name: Upload normal test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-normal
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*

      # <— This is the key: allow this to fail without failing the whole job
      - name: Run tests with NonDex shuffling (expected to fail if flaky)
        continue-on-error: true
        run: mvn -B edu.illinois:nondex-maven-plugin:run

      - name: Upload NonDex test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-nondex
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
